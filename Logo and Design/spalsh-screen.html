<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .splash-gradient {
            background: linear-gradient(135deg, #a0f399 0%, #ffdbce 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen overflow-hidden">
<!-- Splash Screen Container -->
<!-- The navigation shell is suppressed for this splash screen as per the "The Destination Rule" and "Automatic Suppression" mandates for splash/onboarding screens. -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center splash-gradient px-margin-mobile">
<!-- Abstract Background Elements for Modern UI Depth -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-secondary opacity-30 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-tertiary-container opacity-20 blur-[120px]"></div>
</div>
<!-- Central Branding Cluster -->
<div class="z-10 flex flex-col items-center text-center">
<!-- Logo Container -->
<div class="mb-stack-lg relative">
<div class="w-32 h-32 md:w-40 md:h-40 bg-surface-container-lowest rounded-[32px] shadow-sm flex items-center justify-center border border-outline-variant">
<!-- Icon placeholder representing community and growth -->
<span class="material-symbols-outlined text-[64px] md:text-[80px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                        agriculture
                    </span>
</div>
<!-- Subtle reflection effect -->
<div class="absolute -bottom-4 w-full h-8 bg-black/5 blur-xl rounded-full"></div>
</div>
<!-- App Identity -->
<div class="space-y-base">
<h1 class="font-display-lg text-display-lg text-on-secondary-fixed-variant tracking-tight">
                    Grama-Suvidha
                </h1>
<p class="font-title-lg text-title-lg text-on-tertiary-fixed-variant/80 max-w-[280px] mx-auto leading-tight">
                    Track Your Village Progress
                </p>
</div>
</div>
<!-- Footer Visual/Loading Indicator -->
<div class="absolute bottom-stack-lg flex flex-col items-center gap-stack-sm">
<!-- Progress Tracker: Large, linear progress bar in Growth Green as per Style Guidance -->
<div class="w-48 h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full"></div>
</div>
<span class="font-label-lg text-label-lg text-outline uppercase tracking-widest">
                Loading Data
            </span>
</div>
<!-- Hero Decorative Image (Atmospheric background texture) -->
<div class="absolute inset-0 z-0 opacity-10 mix-blend-overlay">
<img alt="" class="w-full h-full object-cover" data-alt="A lush and serene rural landscape at sunrise, featuring rolling green hills and traditional village architecture bathed in warm, earthy golden hour light. The image captures a sense of growth and sustainability with vibrant green fields and clear morning skies, mirroring a modern corporate light-mode aesthetic with soft shadows and natural tones. The composition is clean and minimalist, emphasizing tranquility and village progress." src="https://lh3.googleusercontent.com/aida-public/AB6AXuASACsn8etJdS3ceJj1-QMb-UZaB1HtaVdgLS3Sqs7roclksFcWugq4GXTaYueRVoMaETNsU85en8ML9RAd89tMst1Z4Znmm4gMUx9rwDM1Fc4OSqxKOvS3I_NNVoS8Z_5it-jfsD0d9h2t3wYgYSKchDgXm9V2tkkXUWhs4op9wBX2pdH1F-eUH0_CO0MX5pZHD724unUQ9JCy4ilysJl1dPOj0DNP4j_z-hhEYBkEnF8B4fuGxIU3W1KcSfb9mgsJKi7afjB0iiQ"/>
</div>
</main>
<!-- Illustrative Card Section (Hidden on small screens, shown as feature preview on larger) -->
<div class="hidden md:flex fixed right-margin-mobile top-1/2 -translate-y-1/2 flex-col gap-gutter z-20">
<!-- Feature Card 1 -->
<div class="w-72 p-gutter bg-surface-container-lowest border border-outline-variant rounded-[24px] shadow-sm">
<div class="flex items-center gap-base mb-base">
<span class="material-symbols-outlined text-secondary">analytics</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Infrastructure Status</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-3/4"></div>
</div>
<p class="mt-base font-body-md text-body-md text-on-surface">Road Development: 75% Complete</p>
</div>
<!-- Feature Card 2 -->
<div class="w-72 p-gutter bg-surface-container-lowest border border-outline-variant rounded-[24px] shadow-sm translate-x-margin-mobile">
<div class="flex items-center gap-base mb-base">
<span class="material-symbols-outlined text-primary">account_balance</span>
<span class="font-label-lg text-label-lg text-on-surface-variant">Govt Schemes</span>
</div>
<p class="font-headline-md text-headline-md text-on-surface">12 Active</p>
<p class="font-body-md text-body-md text-outline">Schemes currently in progress</p>
</div>
</div>
