    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Focused Layout: Navigation shells suppressed for Transactional journey -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-stack-lg">
<!-- Login Card -->
<div class="w-full max-w-[440px] bg-surface rounded-[24px] border border-outline-variant p-stack-md sm:p-stack-lg shadow-sm">
<!-- Branding/Header Section -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-16 h-16 bg-primary-container flex items-center justify-center rounded-xl mb-stack-sm">
<span class="material-symbols-outlined text-[40px] text-on-primary-container" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary text-center">Grama-Suvidha</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Connecting communities through digital stewardship</p>
</div>
<form class="space-y-stack-md">
<!-- MD3 Filled Text Field: Email -->
<div class="relative group">
<div class="bg-surface-container-highest rounded-t-lg border-b-2 border-outline focus-within:border-primary transition-all duration-200">
<label class="block pt-2 px-4 font-label-lg text-label-lg text-primary" for="email">Email Address</label>
<div class="flex items-center px-4 pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 h-touch-target-min" id="email" placeholder="Write your email here" type="email"/>
</div>
</div>
</div>
<!-- MD3 Filled Text Field: Password -->
<div class="relative group">
<div class="bg-surface-container-highest rounded-t-lg border-b-2 border-outline focus-within:border-primary transition-all duration-200">
<label class="block pt-2 px-4 font-label-lg text-label-lg text-primary" for="password">Password</label>
<div class="flex items-center px-4 pb-2">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 h-touch-target-min" id="password" placeholder="Enter your password" type="password"/>
<button class="ml-2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Action Links -->
<div class="flex justify-end">
<a class="font-label-lg text-label-lg text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Primary Action Button: Login -->
<div class="pt-stack-sm">
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors shadow-sm active:scale-95 duration-150" type="submit">
<span class="material-symbols-outlined" data-icon="login">login</span>
                        LOGIN
                    </button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="font-label-lg text-label-lg text-on-surface-variant">OR</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Secondary Action Button: Register -->
<div>
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-container border border-outline-variant rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-secondary-fixed transition-colors active:scale-95 duration-150" type="button">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
                        REGISTER
                    </button>
</div>
</form>
<!-- Bottom Disclaimer/Incentive -->
<div class="mt-stack-lg p-stack-sm bg-surface-container-low rounded-xl flex items-start gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="verified_user">verified_user</span>
<p class="font-label-lg text-label-lg text-on-surface-variant">
                    Your data is secure and managed by the Gram Vikas digital stewardship framework.
                </p>
</div>
</div>
</main>
<!-- Footer Meta -->
<footer class="p-margin-mobile text-center">
<p class="font-label-lg text-label-lg text-on-surface-variant">© 2024 Gram Vikas. Empowering Rural Digitality.</p>
</footer>

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-secondary-container/20 rounded-full blur-[100px]"></div>

</div>
